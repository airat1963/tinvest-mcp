[project]
name = "tinvest-mcp"
version = "0.1.0"
description = "MCP server for T-Invest sandbox portfolio analytics"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
]
[project.optional-dependencies]
# ставится отдельно: pip install -e ".[tinvest]"
# требует доступа к индексу T-Банка и настроенного SSL
tinvest = [
    "t-tech-investments>=1.51.0",
]

[project.scripts]
tinvest-mcp = "tinvest_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinvest_mcp"]

